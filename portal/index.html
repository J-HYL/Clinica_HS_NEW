<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HS Dental · Portal del paciente</title>
  <meta name="description" content="Portal del paciente de HS Dental: tus tratamientos, pagos y citas.">
  <meta name="theme-color" content="#5671eb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="HS Dental">
  <link rel="apple-touch-icon" href="/assets/icon-180.png">
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/portal.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:8px">
        <span class="topbar__brand"><img src="/assets/logoHSBlanco.png" alt="HS Dental"></span>
      </div>
      <div style="display:flex;align-items:center;gap:2px">
        <button class="topbar__btn" id="btn-notif" aria-label="Notificaciones">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6 2 6H4s2-1 2-6z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>
          <span class="badge-dot" id="notif-dot" hidden></span>
        </button>
        <button class="topbar__btn" id="btn-perfil" aria-label="Mi perfil">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c1.4-3.6 4.2-5 7.5-5s6.1 1.4 7.5 5"/></svg>
        </button>
      </div>
    </header>
    <main class="view" id="view"><div class="spinner"></div></main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Secciones"></nav>

  <script type="module" src="/js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
