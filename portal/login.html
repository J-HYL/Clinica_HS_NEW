<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Acceso · Portal HS Dental</title>
  <meta name="description" content="Accede al portal del paciente de HS Dental.">
  <meta name="theme-color" content="#5671eb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="HS Dental">
  <link rel="apple-touch-icon" href="/assets/icon-180.png">
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/portal.css">
</head>
<body class="auth" data-auth="login">
  <main class="auth__card">
    <div class="auth__brand"><img src="/assets/logo.png" alt="HS Dental El Greco"></div>
    <h1 class="auth__title" id="title">Portal del paciente</h1>
    <p class="auth__sub" id="sub">Accede con tu email para ver tus tratamientos y citas</p>
    <div id="msg" class="auth__msg"></div>
    <form id="form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input class="input" id="email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="tu@email.com" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
      </div>
      <button class="btn btn--block" id="submit" type="submit">Entrar</button>
    </form>
    <a class="auth__link" href="/reset.html">¿Has olvidado tu contraseña?</a>
  </main>
  <script type="module" src="/js/auth-pages.js"></script>
</body>
</html>
