<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Activa tu cuenta · Portal HS Dental</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#5671eb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/portal.css">
</head>
<body class="auth" data-auth="activar">
  <main class="auth__card">
    <div class="auth__logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4c-1.6 0-2.4.8-4 .8S5 4 4.5 6.2C4 9 5 11 5.6 14c.4 2.4.9 5 2.1 5 1.3 0 1.4-2.4 1.7-4.2.2-1.2.4-2 .8-2h1.6c.4 0 .6.8.8 2 .3 1.8.4 4.2 1.7 4.2 1.2 0 1.7-2.6 2.1-5 .6-3 1.6-5 1.1-7.8C18.9 4 17.2 4.8 16 4.8S13.6 4 12 4z"/></svg></div>
    <h1 class="auth__title" id="title">Crea tu contraseña</h1>
    <p class="auth__sub" id="sub">Elige una contraseña para activar tu acceso al portal</p>
    <div id="msg" class="auth__msg"></div>
    <form id="form" novalidate>
      <div class="field">
        <label for="password">Contraseña</label>
        <input class="input" id="password" name="password" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres" required>
        <div class="pwbar" id="pwbar"><span></span></div>
      </div>
      <div class="field">
        <label for="password2">Repite la contraseña</label>
        <input class="input" id="password2" name="password2" type="password" autocomplete="new-password" placeholder="••••••••" required>
      </div>
      <button class="btn btn--block" id="submit" type="submit">Activar mi cuenta</button>
    </form>
    <a class="auth__link" href="/login.html">Volver al acceso</a>
  </main>
  <script type="module" src="/js/auth-pages.js"></script>
</body>
</html>
