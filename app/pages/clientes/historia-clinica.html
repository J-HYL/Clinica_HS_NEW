<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historia clínica · HS Dental</title>

    <!-- Scripts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css" integrity="sha512-XcIsjKMcuVe0Ucj/xgIXQnytNwBttJbNjltBV18IOnru2lDPe9KRRyvCXw6Y5H415vbBLRm8+q6fmLUU7DfO6Q==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Styles -->
    <link rel="stylesheet" href="/css/pages/ficha.css">
    <link rel="stylesheet" href="/css/components/selectorCita.css">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/assets/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="HS Dental" />
    <link rel="manifest" href="/assets/favicon/site.webmanifest"/>
</head>
<body>
    <nav class="sidebar" id="sidebar"></nav>

    <div class="wrapper">
        <main class="ficha">
            <a href="control.html" class="ficha__volver"><i class="ri-arrow-left-line" aria-hidden="true"></i> Pacientes</a>

            <div class="ficha__cabecera">
                <div class="ficha__identidad">
                    <span class="iniciales" id="iniciales-paciente" aria-hidden="true"></span>
                    <div>
                        <h1 class="page-title"><span id="nombre-paciente"></span></h1>
                        <p class="ficha__intro">Historia clínica</p>
                    </div>
                </div>
                <div class="ficha__acciones">
                    <a href="/pages/Presupuestos/presupuesto.html" class="boton boton--secundario" id="nuevo-presupuesto">
                        <i class="ri-file-list-3-line" aria-hidden="true"></i> Nuevo presupuesto
                    </a>
                    <button type="button" id="dar-cita" class="boton boton--primario">
                        <i class="ri-calendar-todo-line" aria-hidden="true"></i> Programar cita
                    </button>
                </div>
            </div>

            <section class="tarjeta ficha__bloque" aria-labelledby="datos-titulo">
                <div class="tarjeta__cabecera">
                    <h2 class="tarjeta__titulo" id="datos-titulo">Datos del paciente</h2>
                </div>
                <dl class="tarjeta__cuerpo datos">
                    <div class="dato">
                        <dt class="dato__etiqueta">Teléfono</dt>
                        <dd class="dato__valor" id="telefono-paciente"></dd>
                    </div>
                    <div class="dato">
                        <dt class="dato__etiqueta">Email</dt>
                        <dd class="dato__valor" id="email-paciente"></dd>
                    </div>
                    <div class="dato">
                        <dt class="dato__etiqueta">Fecha de alta</dt>
                        <dd class="dato__valor" id="fecha-alta-paciente"></dd>
                    </div>
                    <div class="dato">
                        <dt class="dato__etiqueta">Edad</dt>
                        <dd class="dato__valor" id="edad"></dd>
                    </div>
                    <div class="dato">
                        <dt class="dato__etiqueta">Alergias</dt>
                        <dd class="dato__valor" id="alergias"></dd>
                    </div>
                    <div class="dato">
                        <dt class="dato__etiqueta">Deuda pendiente</dt>
                        <dd class="dato__valor dato__valor--importe" id="deuda-paciente"></dd>
                    </div>
                </dl>
            </section>

            <section class="container ficha__bloque">
                <div class="pestanas" role="tablist" aria-label="Historia clínica">
                    <button type="button" class="pestanas__opcion" role="tab" id="pestana-tratamientos" aria-controls="panel-tratamientos" aria-selected="true" data-tab="tratamientos">Tratamientos</button>
                    <button type="button" class="pestanas__opcion" role="tab" id="pestana-visitas" aria-controls="panel-visitas" aria-selected="false" tabindex="-1" data-tab="visitas">Visitas</button>
                    <button type="button" class="pestanas__opcion" role="tab" id="pestana-solicitudes" aria-controls="panel-solicitudes" aria-selected="false" tabindex="-1" data-tab="solicitudes">Solicitudes</button>
                </div>

                <div role="tabpanel" id="panel-tratamientos" aria-labelledby="pestana-tratamientos">
                    <div class="lista__cabecera">
                        <h3 class="container__heading">Tratamientos del paciente</h3>
                        <div class="lista__acciones">
                            <button type="button" class="boton boton--primario boton--pequeno" id="crear-tratamiento"><i class="ri-add-line" aria-hidden="true"></i> Crear tratamiento</button>
                        </div>
                    </div>
                    <div id="table"></div>
                </div>

                <div role="tabpanel" id="panel-visitas" aria-labelledby="pestana-visitas" hidden>
                    <section id="visitas-section"></section>
                </div>

                <div role="tabpanel" id="panel-solicitudes" aria-labelledby="pestana-solicitudes" hidden>
                    <section id="solicitudes-ficha-wrap"></section>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal para crear / editar un tratamiento -->
    <dialog class="modal" id="edit-modal" aria-labelledby="tratamiento-modal-titulo">
        <div class="modal__container modal__container--ancho">
            <section class="modal__card">
                <header class="modal__header">
                    <h2 class="modal__heading" id="tratamiento-modal-titulo">Crear tratamiento</h2>
                    <button type="button" class="modal__close" aria-label="Cerrar"><i class="ri-close-line" aria-hidden="true"></i></button>
                </header>

                <form action="#" class="modal__body tratamiento-form" id="form-tratamiento">
                    <div class="form__group">
                        <label for="diagnostico" class="form__label">Tratamiento</label>
                        <select name="diagnostico" id="diagnostico" class="form__input form__input--select" required>
                            <option value="Extracción">Extracción</option>
                            <option value="Empaste simple">Empaste simple</option>
                            <option value="Empaste compuesto">Empaste compuesto</option>
                            <option value="Reconstrucciones">Reconstrucciones</option>
                            <option value="Endodoncia unirradicular">Endodoncia unirradiculares</option>
                            <option value="Endodoncia multirradicular">Endodoncia multirradiculares</option>
                            <option value="Perno de fibra">Perno de fibra</option>
                            <option value="Limpieza">Limpieza</option>
                            <option value="Fundas">Fundas</option>
                            <option value="Implantes">Implantes</option>
                            <option value="Prótesis">Prótesis</option>
                            <option value="otro">Otro...</option>
                        </select>
                    </div>
                    <div id="customTreatmentWrapper" class="form__group form__group--hidden">
                        <label for="customTreatmentInput" class="form__label">Nombre del tratamiento</label>
                        <input type="text" id="customTreatmentInput" class="form__input" placeholder="Especifica el tratamiento" />
                    </div>

                    <div class="form__group tratamiento-form__ancho">
                        <label for="observaciones" class="form__label">Observaciones</label>
                        <input type="text" name="observaciones" id="observaciones" class="form__input" placeholder="Observaciones" />
                    </div>

                    <div class="form__group">
                        <label for="monto_total" class="form__label">Monto total</label>
                        <input type="number" id="monto_total" name="monto_total" class="form__input" min="0" step="0.01" inputmode="decimal" />
                    </div>

                    <div class="form__group">
                        <label for="monto_pagado" class="form__label">Abonado</label>
                        <input type="number" id="monto_pagado" name="monto_pagado" class="form__input" min="0" step="0.01" inputmode="decimal" />
                    </div>

                    <fieldset class="form__group tratamiento-form__ancho piezas">
                        <legend class="form__label">Piezas afectadas</legend>
                        <label class="pieza pieza--general"><input type="checkbox" name="piezas[]" value="general"><span>General (toda la boca)</span></label>
                        <div class="piezas__mapa">
                            <p class="piezas__rotulo">Piezas superiores</p>
                            <div class="piezas__arcada">
                                <div class="piezas__cuadrante" role="group" aria-label="Superior derecha">
                                    <label class="pieza"><input type="checkbox" name="piezas[]" value="18"><span>18</span></label>
                                    <label class="pieza"><input type="checkbox" name="piezas[]" value="17"><span>17</span></label>
                                    <label class="pieza"><input type="checkbox" name="piezas[]" value="16"><span>16</span></label>
                                    <label class="pieza"><input type="checkbox" name="piezas[]" value="15"><span>15</span></label>
                                    <label class="pieza"><input type="checkbox" name="piezas[]" value="14"><span>14</span></label>
                                    <label class="pieza"><input type="checkbox" name="piezas[]" value="13"><span>13</span></label>
                                    <label class="pieza"><input type="checkbox" name="piezas[]" value="12"><span>12</span></label>
                                    <label class="pieza"><input type="checkbox" name="piezas[]" value="11"><span>11</span></label>
                                </div>
                                <div class="piezas__cuadrante" role="group" aria-label="Superior izquierda">
                                    <label class="pieza"><input type="checkbox" name="piezas[]" value="21"><span>21</span></label>
                                    <label class="pieza"><input type="checkbox" name="piezas[]" value="22"><span>22</span></label>
                                    <label class="pieza"><input type="checkbox" name="piezas[]" value="23"><span>23</span></label>
                                    <label class="pieza"><input type="checkbox" name="piezas[]" value="24"><span>24</span></label>
                                    <label class="pieza"><input type="checkbox" name="piezas[]" value="25"><span>25</span></label>
                                    <label class="pieza"><input type="checkbox" name="piezas[]" value="26"><span>26</span></label>
                                    <label class="pieza"><input type="checkbox" name="piezas[]" value="27"><span>27</span></label>
                                    <label class="pieza"><input type="checkbox" name="piezas[]" value="28"><span>28</span></label>
                                </div>
                            </div>

                            <p class="piezas__rotulo">Piezas inferiores</p>
                            <div class="piezas__arcada">
                                <div class="piezas__cuadrante" role="group" aria-label="Inferior derecha">
                                    <label class="pieza"><input type="checkbox" name="piezas[]" value="48"><span>48</span></label>
                                    <label class="pieza"><input type="checkbox" name="piezas[]" value="47"><span>47</span></label>
                                    <label class="pieza"><input type="checkbox" name="piezas[]" value="46"><span>46</span></label>
                                    <label class="pieza"><input type="checkbox" name="piezas[]" value="45"><span>45</span></label>
                                    <label class="pieza"><input type="checkbox" name="piezas[]" value="44"><span>44</span></label>
                                    <label class="pieza"><input type="checkbox" name="piezas[]" value="43"><span>43</span></label>
                                    <label class="pieza"><input type="checkbox" name="piezas[]" value="42"><span>42</span></label>
                                    <label class="pieza"><input type="checkbox" name="piezas[]" value="41"><span>41</span></label>
                                </div>
                                <div class="piezas__cuadrante" role="group" aria-label="Inferior izquierda">
                                    <label class="pieza"><input type="checkbox" name="piezas[]" value="31"><span>31</span></label>
                                    <label class="pieza"><input type="checkbox" name="piezas[]" value="32"><span>32</span></label>
                                    <label class="pieza"><input type="checkbox" name="piezas[]" value="33"><span>33</span></label>
                                    <label class="pieza"><input type="checkbox" name="piezas[]" value="34"><span>34</span></label>
                                    <label class="pieza"><input type="checkbox" name="piezas[]" value="35"><span>35</span></label>
                                    <label class="pieza"><input type="checkbox" name="piezas[]" value="36"><span>36</span></label>
                                    <label class="pieza"><input type="checkbox" name="piezas[]" value="37"><span>37</span></label>
                                    <label class="pieza"><input type="checkbox" name="piezas[]" value="38"><span>38</span></label>
                                </div>
                            </div>
                        </div>
                    </fieldset>
                </form>

                <footer class="modal__footer">
                    <button type="button" class="boton boton--secundario modal__button--close">Cancelar</button>
                    <button type="button" class="boton boton--primario" id="guardar-tratamiento">Guardar cambios</button>
                </footer>
            </section>
        </div>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/main.js" type="module"></script>
    <script src="/js/pages/clientes/historia-clinica.js" type="module"></script>
    <script src="/js/pages/clientes/dar-cita.js" type="module"></script>
    <script src="/js/pages/clientes/solicitudes-ficha.js" type="module"></script>

</body>
</html>
