    <div class="wrapper">

        <main class="container main">
            <h3 class="container__heading">Crear Cliente</h3>
            <form action="#" class="form">
                <div class="form__group">
                    <label for="nombre" class="form__label">Nombre del Cliente</label>
                    <input type="text" id="nombre" name="nombre" class="form__input" placeholder="Ej: Marcos López" data-required="true">
                </div>
                <div class="form__group">
                    <label for="email" class="form__label">Email</label>
                    <input type="text" id="email" name="email" class="form__input" placeholder="Ej: marcoslopez14@hsdental.es" data-validate="email">
                </div>
                <div class="form__group">
                    <label for="telefono" class="form__label">Teléfono</label>
                    <input type="number" name="telefono" id="telefono" class="form__input" placeholder="Ej: 633673456" data-validate="phone" data-required="true">
                </div>
                <div class="form__group">
                    <label for="edad" class="form__label">Edad</label>
                    <input type="number" name="edad" id="edad" class="form__input" placeholder="Ej: 20">
                </div>
                <div class="form__group">
                    <label for="alergias" class="form__label">Alergias</label>
                    <input type="text" name="alergias" id="alergias" class="form__input" placeholder="Ej: Penicilina, ...">
                </div>
                <div class="form__buttons">
                    <button type="submit" class="form__submit" data-action="create">Crear Cliente <i class="ri-add-line"></i></button>
                    <a href="control.html" class="form__return">Regresar</a>
                </div>
            </form>
