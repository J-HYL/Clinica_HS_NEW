<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HS Dental - Agregar Nuevo Cliente</title>

    <!-- Scripts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css" integrity="sha512-XcIsjKMcuVe0Ucj/xgIXQnytNwBttJbNjltBV18IOnru2lDPe9KRRyvCXw6Y5H415vbBLRm8+q6fmLUU7DfO6Q==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Styles -->
    <link rel="stylesheet" href="/css/pages/agregar.css">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/assets/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="HS Dental" />
    <link rel="manifest" href="/assets/favicon/site.webmanifest"/>

</head>
<body>
    <nav class="sidebar" id="sidebar"></nav>

    <div class="wrapper">

        <main class="container main">
            <h3 class="container__heading">Crear Cliente</h3>
            <form action="#" class="form">
                <div class="form__group">
                    <label for="nombre" class="form__label">Nombre del Cliente</label>
                    <input type="text" id="nombre" name="nombre" class="form__input" placeholder="Ej: Marcos López" data-required="true">
                </div>
                <div class="form__group">
                    <label for="email" class="form__label">Email</label>
                    <input type="text" id="email" name="email" class="form__input" placeholder="Ej: marcoslopez14@hsdental.es" data-validate="email">
                </div>
                <div class="form__group">
                    <label for="telefono" class="form__label">Teléfono</label>
                    <input type="number" name="telefono" id="telefono" class="form__input" placeholder="Ej: 633673456" data-validate="phone" data-required="true">
                </div>
                <div class="form__group">
                    <label for="edad" class="form__label">Edad</label>
                    <input type="number" name="edad" id="edad" class="form__input" placeholder="Ej: 20">
                </div>
                <div class="form__group">
                    <label for="alergias" class="form__label">Alergias</label>
                    <input type="text" name="alergias" id="alergias" class="form__input" placeholder="Ej: Penicilina, ...">
                </div>
                <div class="form__buttons">
                    <button type="submit" class="form__submit" data-action="create">Crear Cliente <i class="ri-add-line"></i></button>
                    <a href="control.html" class="form__return">Regresar</a>
                </div>
            </form>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/main.js" type="module"></script>
    <script src="/js/pages/clientes/agregar.js" type="module"></script>
</body>
</html>
