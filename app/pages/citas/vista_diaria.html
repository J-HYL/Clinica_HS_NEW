    <div class="wrapper">
        <header class="header">
            <div class="header__group">
                <button class="header__menu" aria-label="Abrir Sidebar" >
                    <i class="ri-menu-line"></i>
                </button>
                <h1 class="header__heading">HS Dental - <span>Citas</span></h1>
            </div>

        </header>

        <div class="content-layout">
            <main class="container main">
                <h3 class="container__heading">Crear Cita</h3>
                <form id="event-form" class="form">
                  <!--Cliente-->
                    <div class="form__group">
                        <label for="servicio" class="form__label">Paciente</label>
                        <input
                          type="text"
                          name="servicio"
                          id="servicio"                                
                          class="form__input"
                          placeholder="Escribe SOLO el nombre del Cliente"
                          required
                        />
                    </div>
                    <!--Observaciones-->
                    <div class="form__group">
                        <label for="cliente" class="form__label">Observaciones</label>
                        <input type="text" name="cliente" id="cliente" class="form__input" placeholder="TELEFONO, Servicio, etc..."  />
                    </div>
                  


                    <div class="form__group">
                        <label for="fecha" class="form__label">Fecha y Hora</label>
                        <input type="datetime-local" id="fecha" name="fecha" class="form__input form__input--datetime" data-required="true" min="" required />
                    </div>

                    <div class="form__group">
                        <label for="medico" class="form__label">Médico</label>
                        <select  name="medico" id="medico" class="form__input form__input--select" required>
                            <option value="med1">GABINETE 1</option>
                            <option value="med2">GABINETE 2</option>
                        </select>
                    </div>
                    
                    <div class="form__group form__group--hidden">
                        <label for="estado">Estado</label>
                    <select id="estado" name="estado" required>
                        <option value="Pendiente" selected>Pendiente</option>
                        <option value="Completada">Completada</option>
                        <option value="Cancelada">Cancelada</option>
                    </select>
                    </div>

                    <div class="form__buttons">
                        <button type="submit" class="form__submit" data-action="create">Crear Cita <i class="ri-add-line"></i></button>
                        <a href="calendario.html" class="form__return">Regresar</a>
                    </div>
                </form>
            </main>
            <!--Calendario-->
            <div id="calendar" class="container main"></div>

        </div>
    </div>
    <!--Modal de edicion-->
    <dialog class="modal" id="edit-modal" role="dialog"
        aria-labelledby="Actualizar Cita"
        aria-describedby="Modal para una Cita">
        <div class="modal__container">
            <section class="modal__card">
                <header class="modal__header">
                    <h3 class="modal__heading">Actualizar Cita</h3>
                    <button type="button" class="modal__close" aria-label="Cerrar Modal">
                    <i class="ri-close-line"></i>
                    </button>
                </header>

                <form action="#" class="form">
                    <div class="form__group">
                    <label for="edit-servicio" class="form__label">Paciente</label>
                    <input
                        type="text"
                        name="edit-servicio"
                        id="edit-servicio"
                        class="form__input"
                        placeholder="Escribe SOLO el nombre del Cliente"
                        required
                    />
                    </div>

                    <div class="form__group">
                    <label for="edit-cliente" class="form__label">Observaciones</label>
                    <input
                        type="text"
                        name="edit-cliente"
                        id="edit-cliente"
                        class="form__input"
                        placeholder="TELEFONO, Servicio, etc..."
                    />
                    </div>

                    <div class="form__group">
                    <label for="edit-fecha" class="form__label">Fecha y Hora</label>
                    <input
                        type="datetime-local"
                        id="edit-fecha"
                        name="edit-fecha"
                        class="form__input form__input--datetime"
                        data-required="true"
                    />
                    </div>

                    <div class="form__group">
                    <label for="edit-medico" class="form__label">Médico</label>
                    <select name="edit-medico" id="edit-medico" class="form__input form__input--select" required>
                        <option value="med1">Médico 1</option>
                        <option value="med2">Médico 2</option>
                    </select>
                    </div>

                    <div class="form__group">
                    <label for="edit-estado" class="form__label">Estado</label>
                    <select id="edit-estado" name="edit-estado" class="form__input form__input--select" required>
                        <option value="Pendiente" selected>Pendiente</option>
                        <option value="Completada">Completada</option>
                        <option value="Cancelada">Cancelada</option>
                    </select>
                    </div>
                </form>

                <footer class="modal__footer">
                    <button type="button" class="modal__button modal__button--close" aria-label="Cancelar y Cerrar Modal">Cancelar</button>
                    <button type="button" class="modal__button modal__button--primary" id="update-medico">Guardar Cambios</button>
                </footer>
            </section>
        </div>
    </dialog>
