<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Cita</title>

    <!-- FullCalendar Scheduler -->
    <script src="https://unpkg.com/fullcalendar-scheduler@6.1.17/index.global.min.js"></script>

    <!-- Scripts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css" integrity="sha512-XcIsjKMcuVe0Ucj/xgIXQnytNwBttJbNjltBV18IOnru2lDPe9KRRyvCXw6Y5H415vbBLRm8+q6fmLUU7DfO6Q==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Styles -->
    <link rel="stylesheet" href="/css/pages/agregar.css">
    <link rel="stylesheet" href="/css/components/modal.css">
    <link rel="stylesheet" href="/css/pages/vistaDiaria.css">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="assets/favicon/favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/assets/favicon/site.webmanifest"/>
</head>
<body>
    <nav class="sidebar" id="sidebar"></nav>

    <div class="wrapper">
        <h1 class="page-title">Citas</h1>

        <button type="button" class="boton boton--primario sheet__trigger" id="open-form">
            <i class="ri-add-line" aria-hidden="true"></i> Crear cita
        </button>

        <div class="content-layout">
            <main class="container main form-sheet" id="form-sheet">
                <span class="sheet__grabber" aria-hidden="true"></span>
                <div class="sheet__head">
                    <h2 class="container__heading" id="form-title">Crear Cita</h2>
                    <button type="button" class="boton boton--icono boton--fantasma sheet__close" id="close-form" aria-label="Cerrar el formulario">
                        <i class="ri-close-line" aria-hidden="true"></i>
                    </button>
                </div>

                <div class="segmentado form-mode" role="tablist" aria-label="Tipo de registro">
                    <button type="button" class="segmentado__opcion form-mode__btn" data-mode="cita" role="tab" aria-selected="true">
                        <i class="ri-calendar-2-line" aria-hidden="true"></i> Nueva cita
                    </button>
                    <button type="button" class="segmentado__opcion form-mode__btn" data-mode="bloqueo" role="tab" aria-selected="false">
                        <i class="ri-lock-2-line" aria-hidden="true"></i> Bloquear
                    </button>
                </div>

                <form id="event-form" class="form" data-mode="cita">
                  <!--Cliente-->
                    <div class="form__group js-cita-field">
                        <label for="servicio" class="form__label">Paciente</label>
                        <input
                          type="text"
                          name="servicio"
                          id="servicio"
                          class="form__input"
                          placeholder="Escribe SOLO el nombre del Cliente"
                          required
                        />
                    </div>
                    <!--Observaciones-->
                    <div class="form__group js-cita-field">
                        <label for="cliente" class="form__label">Observaciones</label>
                        <input type="text" name="cliente" id="cliente" class="form__input" placeholder="TELEFONO, Servicio, etc..."  />
                    </div>
                    <!--Motivo del bloqueo-->
                    <div class="form__group js-bloqueo-field" hidden>
                        <label for="motivo" class="form__label">Motivo (opcional)</label>
                        <input type="text" id="motivo" class="form__input" placeholder="Comida, día libre, reunión..." />
                    </div>

                    <div class="form__group">
                        <label for="fecha" class="form__label">Fecha y Hora</label>
                        <input type="datetime-local" id="fecha" name="fecha" class="form__input form__input--datetime" data-required="true" min="" required />
                    </div>

                    <!--Bloqueo: todo el día-->
                    <div class="form__group js-bloqueo-field" hidden>
                        <label class="form__switch" for="todo-dia">
                            <input type="checkbox" id="todo-dia"> Bloquear el día completo (09:00–21:00)
                        </label>
                    </div>
                    <!--Bloqueo: duración-->
                    <div class="form__group js-bloqueo-field" id="dur-group" hidden>
                        <label for="duracion" class="form__label">Duración</label>
                        <select id="duracion" class="form__input form__input--select">
                            <option value="30">30 minutos</option>
                            <option value="60" selected>1 hora</option>
                            <option value="90">1 hora 30 min</option>
                            <option value="120">2 horas</option>
                            <option value="180">3 horas</option>
                        </select>
                    </div>

                    <div class="form__group">
                        <label for="medico" class="form__label">Gabinete</label>
                        <select  name="medico" id="medico" class="form__input form__input--select" required>
                            <option value="med1">GABINETE 1</option>
                            <option value="med2">GABINETE 2</option>
                            <option value="ambos" hidden>Ambos gabinetes</option>
                        </select>
                    </div>

                    <div class="form__group form__group--hidden">
                        <label for="estado">Estado</label>
                    <select id="estado" name="estado" required>
                        <option value="Pendiente" selected>Pendiente</option>
                        <option value="Completada">Completada</option>
                        <option value="Cancelada">Cancelada</option>
                    </select>
                    </div>

                    <div class="form__buttons">
                        <button type="submit" class="boton boton--primario" id="submit-btn" data-action="create">Crear Cita <i class="ri-add-line"></i></button>
                        <a href="calendario.html" class="boton boton--secundario">Regresar</a>
                    </div>
                </form>
            </main>
            <!--Calendario-->
            <section class="tarjeta cal-panel" aria-label="Agenda del día">
                <div class="cal-panel__cabecera">
                    <ul class="leyenda" aria-label="Estados de las citas">
                        <li class="leyenda__item color-estado" data-estado="pendiente">Pendiente</li>
                        <li class="leyenda__item color-estado" data-estado="completada">Completada</li>
                        <li class="leyenda__item color-estado" data-estado="cancelada">Cancelada</li>
                        <li class="leyenda__item color-estado" data-estado="bloqueado">Bloqueo</li>
                    </ul>
                    <nav class="segmentado" aria-label="Vista del calendario">
                        <a href="calendario.html" class="segmentado__opcion">Mes</a>
                        <a href="semana.html" class="segmentado__opcion">Semana</a>
                        <a href="vista_diaria.html" class="segmentado__opcion" aria-current="page">Día</a>
                    </nav>
                </div>
                <div id="calendar"></div>
            </section>
        </div>

        <div class="sheet__backdrop" id="sheet-backdrop"></div>
    </div>
    <!--Modal de edicion-->
    <dialog class="modal" id="edit-modal" aria-labelledby="edit-modal-titulo">
        <div class="modal__container">
            <section class="modal__card">
                <header class="modal__header">
                    <h3 class="modal__heading" id="edit-modal-titulo">Actualizar Cita</h3>
                    <button type="button" class="boton boton--icono boton--fantasma modal__close" aria-label="Cerrar">
                        <i class="ri-close-line" aria-hidden="true"></i>
                    </button>
                </header>

                <form action="#" class="form">
                    <div class="form__group">
                    <label for="edit-servicio" class="form__label">Paciente</label>
                    <input
                        type="text"
                        name="edit-servicio"
                        id="edit-servicio"
                        class="form__input"
                        placeholder="Escribe SOLO el nombre del Cliente"
                        required
                    />
                    </div>

                    <div class="form__group">
                    <label for="edit-cliente" class="form__label">Observaciones</label>
                    <input
                        type="text"
                        name="edit-cliente"
                        id="edit-cliente"
                        class="form__input"
                        placeholder="TELEFONO, Servicio, etc..."
                    />
                    </div>

                    <div class="form__group">
                    <label for="edit-fecha" class="form__label">Fecha y Hora</label>
                    <input
                        type="datetime-local"
                        id="edit-fecha"
                        name="edit-fecha"
                        class="form__input form__input--datetime"
                        data-required="true"
                    />
                    </div>

                    <div class="form__group">
                    <label for="edit-medico" class="form__label">Gabinete</label>
                    <select name="edit-medico" id="edit-medico" class="form__input form__input--select" required>
                        <option value="med1">Gabinete 1</option>
                        <option value="med2">Gabinete 2</option>
                    </select>
                    </div>

                    <div class="form__group">
                    <label for="edit-estado" class="form__label">Estado</label>
                    <select id="edit-estado" name="edit-estado" class="form__input form__input--select" required>
                        <option value="Pendiente" selected>Pendiente</option>
                        <option value="Completada">Completada</option>
                        <option value="Cancelada">Cancelada</option>
                    </select>
                    </div>
                </form>

                <footer class="modal__footer">
                    <button type="button" class="boton boton--secundario modal__button--close">Cancelar</button>
                    <button type="button" class="boton boton--primario" id="update-medico">Guardar cambios</button>
                </footer>
            </section>
        </div>
    </dialog>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/main.js" type="module"></script>
    <script src="/js/pages/citas/vistaDiaria.js" type="module"></script>
</body>
</html>
