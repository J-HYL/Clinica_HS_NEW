<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vista Semanal de Citas</title>

    <!-- Scripts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css" integrity="sha512-XcIsjKMcuVe0Ucj/xgIXQnytNwBttJbNjltBV18IOnru2lDPe9KRRyvCXw6Y5H415vbBLRm8+q6fmLUU7DfO6Q==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Styles -->
    <link rel="stylesheet" href="/css/pages/calendario.css">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="assets/favicon/favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/assets/favicon/site.webmanifest"/>
</head>
<body>
    <nav class="sidebar" id="sidebar"></nav>

    <div class="wrapper">
        <h1 class="page-title">Semana</h1>

        <main class="tarjeta calendario">
            <header class="calendario__cabecera">
                <div class="calendario__navegacion">
                    <button type="button" class="boton boton--icono boton--secundario calendar__button--previous" aria-label="Semana anterior">
                        <i class="ri-arrow-left-s-line" aria-hidden="true"></i>
                    </button>
                    <button type="button" class="boton boton--icono boton--secundario calendar__button--next" aria-label="Semana siguiente">
                        <i class="ri-arrow-right-s-line" aria-hidden="true"></i>
                    </button>
                    <h2 class="calendario__titulo" id="calendar-date" aria-live="polite"></h2>
                </div>

                <nav class="segmentado" aria-label="Vista del calendario">
                    <a href="calendario.html" class="segmentado__opcion">Mes</a>
                    <a href="semana.html" class="segmentado__opcion" aria-current="page">Semana</a>
                    <a href="vista_diaria.html" class="segmentado__opcion">Día</a>
                </nav>
            </header>

            <div class="calendario__herramientas">
                <!-- Filtro de gabinete (semana.js) -->
                <div class="segmentado" role="group" aria-label="Filtrar por gabinete">
                    <button type="button" class="segmentado__opcion" data-medico="all" aria-pressed="true">Todos</button>
                    <button type="button" class="segmentado__opcion" data-medico="med1" aria-pressed="false">Gabinete 1</button>
                    <button type="button" class="segmentado__opcion" data-medico="med2" aria-pressed="false">Gabinete 2</button>
                </div>

                <ul class="leyenda" aria-label="Estados de las citas">
                    <li class="leyenda__item color-estado" data-estado="pendiente">Pendiente</li>
                    <li class="leyenda__item color-estado" data-estado="completada">Completada</li>
                    <li class="leyenda__item color-estado" data-estado="cancelada">Cancelada</li>
                    <li class="leyenda__item color-estado" data-estado="bloqueado">Bloqueo</li>
                </ul>
            </div>

            <!-- Cabecera + rejilla en un contenedor con scroll horizontal:
                 en movil los 7 dias se desplazan juntos y alineados.
                 Las rellena WeekCalendar.js. -->
            <div class="week__scroll">
                <div class="week__head" id="week-head"></div>
                <div class="week__grid" id="week-grid"></div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/main.js" type="module"></script>
    <script src="/js/pages/citas/semana.js" type="module"></script>
</body>
</html>
