    <style>
        /* Toggle Mes / Semana (control segmentado sobre la barra del calendario) */
        .calendar__views{
            position: absolute;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            display: inline-flex;
            gap: 2px;
            padding: 3px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 999px;
        }
        .calendar__view-btn{
            padding: 5px 16px;
            border-radius: 999px;
            color: #fff;
            background: transparent;
            text-decoration: none;
            font-size: 0.8em;
            font-weight: 600;
            transition: .2s ease background, .2s ease color;
        }
        .calendar__view-btn--active{
            background: #fff;
            color: var(--primary);
            box-shadow: 0 1px 3px rgba(0, 0, 0, .15);
        }

        @media (max-width: 600px){
            .calendar__views{ right: 16px; }
            .calendar__view-btn{ padding: 4px 12px; font-size: 0.72em; }
        }

        /* Switch de gabinete (control segmentado bajo la cabecera) */
        .calendar__toolbar{
            display: flex;
            gap: 6px;
            padding: 12px 16px;
            background: #fff;
            border-bottom: 1px solid #eef0f4;
        }
        .gab-chip{
            flex: 1;
            padding: 8px 6px;
            border: none;
            border-radius: 10px;
            background: #f1f3f7;
            color: var(--light-gray);
            font-size: 0.82em;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: background .2s ease, color .2s ease, box-shadow .2s ease;
        }
        .gab-chip:hover{ background: #e7ebf3; }
        .gab-chip--active{
            background: var(--primary);
            color: #fff;
            box-shadow: 0 2px 8px rgba(43, 128, 247, .35);
        }
        .gab-chip--active:hover{ background: var(--primary); }

        /* ===== Rejilla semanal (horas × días) ===== */
        /* Cabecera y cuerpo comparten las mismas columnas para alinearse. */
        .week__head, .week__grid{
            display: grid;
            grid-template-columns: 56px repeat(7, 1fr);
        }

        .week__head{
            background: #fff;
            border-bottom: 1px solid #E6E6E6;
        }
        .week__corner{
            border-right: 1px solid #E6E6E6;
        }
        .week__dayhead{
            padding: 12px 4px;
            text-align: center;
            border-left: 1px solid #E6E6E6;
            font-size: 0.95em;
            font-weight: 600;
            color: var(--dark-gray);
        }
        .week__dayhead .week__dayname{
            display: block;
            font-size: 0.78em;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: .04em;
            color: var(--light-gray);
        }
        .week__dayhead--today{
            color: var(--primary);
        }
        .week__dayhead--today .week__dayname{
            color: var(--primary);
        }

        .week__grid{
            background: #FAFAFA;
        }
        .week__hours{
            border-right: 1px solid #E6E6E6;
        }
        .week__hour-label{
            height: 48px;                 /* = ALTO_HORA en WeekCalendar.js */
            box-sizing: border-box;
            padding: 2px 6px 0 0;
            text-align: right;
            font-size: 0.72em;
            color: var(--light-gray);
        }
        .week__col{
            position: relative;
            border-left: 1px solid #E6E6E6;
            min-height: 576px;            /* 12 h × 48px */
            /* Líneas de cada hora */
            background-image: repeating-linear-gradient(to bottom, #ececec 0 1px, transparent 1px 48px);
        }

        .week__event{
            position: absolute;
            border-radius: 8px;
            padding: 2px 6px;
            font-size: 0.72em;
            line-height: 1.2;
            overflow: hidden;
            cursor: pointer;
            box-sizing: border-box;
            color: var(--calendar--appointment-text-color, #333);
            box-shadow: 0 1px 2px rgba(0,0,0,.12);
            transition: .15s ease transform, .15s ease box-shadow;
        }
        .week__event:hover{
            transform: scale(1.02);
            box-shadow: 0 2px 6px rgba(0,0,0,.25);
            z-index: 4;
        }
        .week__event .hora{
            font-weight: 600;
            margin-right: 2px;
        }
        .week__event.appointment__pendiente{  background: var(--calendar-orange-status); }
        .week__event.appointment__completada{ background: var(--calendar-green-status); }
        .week__event.appointment__cancelada{  background: var(--calendar-red-status); }

        /* Arrastrar citas a otro día */
        .week__event{ cursor: grab; }
        .week__event--dragging{ opacity: .5; }
        .week__col.drag__over{ background-color: #eef3ff; }

        /* Línea de "ahora" */
        .week__now{
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--red, #e53935);
            z-index: 3;
        }
        .week__now::before{
            content: "";
            position: absolute;
            left: -4px;
            top: -3px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--red, #e53935);
        }

        /* Contenedor con scroll horizontal: cabecera y rejilla se desplazan juntas */
        .week__scroll{
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* ===== Vista móvil: misma cabecera nativa que el mensual + semana deslizable ===== */
        @media (max-width: 743px){
            .wrapper{ padding: 14px 10px; }
            .main{
                margin-top: 14px;
                border-radius: 20px;
                box-shadow: 0 6px 24px rgba(17, 24, 39, .06);
            }

            /* Cabecera blanca y limpia en lugar de la barra degradada */
            .calendar__header{
                background: #fff;
                background-image: none;
                height: auto;
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
                padding: 16px 16px 12px;
                border-bottom: 1px solid #eef0f4;
            }
            .calendar__header .header__container{
                width: 100%;
                justify-content: space-between;
                gap: 8px;
            }
            .container__heading{
                color: var(--dark-gray);
                font-size: 1.05em;
                font-weight: 700;
            }
            .calendar__button{
                background: transparent;
                width: 38px;
                height: 38px;
                font-size: 1.6em;
            }
            .calendar__header .calendar__button i{ color: var(--primary) !important; }

            .calendar__views{
                position: static;
                transform: none;
                right: auto;
                top: auto;
                align-self: center;
                background: #f1f3f7;
            }
            .calendar__view-btn{ color: var(--light-gray); }
            .calendar__view-btn--active{ background: #fff; color: var(--primary); }

            /* Los 7 días mantienen un ancho mínimo cómodo y se deslizan en horizontal */
            .week__head, .week__grid{
                grid-template-columns: 44px repeat(7, minmax(15vw, 1fr));
                min-width: 620px;
            }
            .week__hour-label{ font-size: 0.68em; }
            .week__dayhead{ font-size: 0.82em; padding: 10px 2px; }

            /* La columna de horas queda fija al hacer scroll lateral */
            .week__corner, .week__hours{
                position: sticky;
                left: 0;
                z-index: 2;
                background: #fff;
            }
            .week__hours{ background: #FAFAFA; }
        }
    </style>
