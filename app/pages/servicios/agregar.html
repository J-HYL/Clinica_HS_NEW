<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Nuevo Servicio</title>

    <!-- Scripts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css" integrity="sha512-XcIsjKMcuVe0Ucj/xgIXQnytNwBttJbNjltBV18IOnru2lDPe9KRRyvCXw6Y5H415vbBLRm8+q6fmLUU7DfO6Q==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Styles -->
    <link rel="stylesheet" href="/css/pages/agregar.css">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="assets/favicon/favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/assets/favicon/site.webmanifest"/>

</head>
<body>
    <nav class="sidebar" id="sidebar"></nav>

    <div class="wrapper">
        <header class="header">
            <div class="header__group">
                <button class="header__menu" aria-label="Abrir Sidebar">
                    <i class="ri-menu-line"></i>
                </button>
                <h1 class="header__heading">HS Dental - <span>Servicios</span></h1>
            </div>
        </header>

        <main class="container main">
            <h3 class="container__heading">Crear Servicio</h3>
            <form action="#" class="form">
                <div class="form__group">
                    <label for="nombre" class="form__label">Nombre del Servicio</label>
                    <input type="text" id="nombre" name="nombre" class="form__input" placeholder="E.g. Diseño Web" data-required="true">
                </div>
                <div class="form__group">
                    <label for="descripcion" class="form__label">Descripción</label>
                    <input type="text" id="descripcion" name="descripcion" class="form__input" placeholder="E.g. Desarrollo de páginas webs" data-required="true">
                </div>
                <div class="form__group">
                    <label for="precio" class="form__label">Precio</label>
                    <input type="number" name="precio" id="precio" class="form__input" placeholder="E.g. 30000" data-required="true" min="0">
                </div>
                <div class="form__buttons">
                    <button type="submit" class="form__submit" data-action="create">Crear Servicio <i class="ri-add-line"></i></button>
                    <a href="control.html" class="form__return">Regresar</a>
                </div>
            </form>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/main.js" type="module"></script>
    <script src="/js/pages/servicios/agregar.js" type="module"></script>
</body>
</html>
