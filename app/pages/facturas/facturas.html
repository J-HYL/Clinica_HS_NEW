<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Factura · HS Dental</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css" integrity="sha512-XcIsjKMcuVe0Ucj/xgIXQnytNwBttJbNjltBV18IOnru2lDPe9KRRyvCXw6Y5H415vbBLRm8+q6fmLUU7DfO6Q==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/css/pages/documentos.css">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/assets/favicon/site.webmanifest"/>
</head>
<body>
    <nav class="sidebar" id="sidebar"></nav>

    <div class="wrapper">
        <h1 class="page-title">Nueva factura</h1>

        <form class="documento documento-editor" id="editor" novalidate>
            <section class="tarjeta documento__seccion" aria-label="Datos de la factura">
                <div class="campos">
                    <div class="form__group">
                        <label class="form__label" for="clinicSelect">Clínica</label>
                        <select class="form__input form__input--select" id="clinicSelect">
                            <option value="" disabled selected>Elige una clínica</option>
                            <option value="mostoles">HS Dental - Móstoles</option>
                            <option value="alcorcon">HS Dental - Alcorcón</option>
                        </select>
                    </div>
                    <div class="form__group">
                        <label class="form__label" for="paymentMethod">Forma de pago</label>
                        <select class="form__input form__input--select" id="paymentMethod">
                            <option value="Transferencia">Transferencia bancaria</option>
                            <option value="Efectivo">Efectivo</option>
                            <option value="Tarjeta">Tarjeta</option>
                            <option value="Domiciliacion">Domiciliación</option>
                        </select>
                    </div>
                </div>
            </section>

            <section class="tarjeta documento__seccion" aria-labelledby="titulo-paciente">
                <h2 class="documento__titulo" id="titulo-paciente">Paciente</h2>
                <div class="campos campos--4">
                    <div class="form__group campo--doble">
                        <label class="form__label" for="patientName">Nombre completo</label>
                        <input class="form__input" id="patientName" list="lista-pacientes" placeholder="Busca un paciente o escribe su nombre" autocomplete="off">
                        <datalist id="lista-pacientes"></datalist>
                    </div>
                    <div class="form__group">
                        <label class="form__label" for="patientDNI">DNI / NIF</label>
                        <input class="form__input" id="patientDNI" placeholder="12345678Z">
                    </div>
                    <div class="form__group">
                        <label class="form__label" for="patientPhone">Teléfono</label>
                        <input class="form__input" id="patientPhone" inputmode="tel">
                    </div>
                    <div class="form__group campo--doble">
                        <label class="form__label" for="patientAddress">Domicilio</label>
                        <input class="form__input" id="patientAddress" placeholder="Calle, nº, CP y ciudad">
                    </div>
                </div>
            </section>

            <section class="tarjeta documento__seccion" aria-labelledby="titulo-lineas">
                <div class="documento__cabecera-seccion">
                    <h2 class="documento__titulo" id="titulo-lineas">Servicios</h2>
                    <a class="enlace" href="/pages/servicios/control.html">Catálogo de servicios</a>
                </div>
                <div id="lineas"></div>
            </section>

            <div class="documento__pie">
                <div class="form__group">
                    <label class="form__label" for="observations">Observaciones</label>
                    <textarea class="form__textarea" id="observations" rows="4" placeholder="Aparecen en la factura"></textarea>
                </div>
                <div class="tarjeta totales" aria-live="polite">
                    <dl class="totales__lista">
                        <div class="totales__fila"><dt>Subtotal</dt><dd data-total="subtotal"></dd></div>
                        <div class="totales__fila">
                            <dt><label for="descuento">Descuento</label></dt>
                            <dd>
                                <select class="form__input form__input--select" id="descuento">
                                    <option value="0">Sin descuento</option>
                                    <option value="5">5 %</option>
                                    <option value="10">10 %</option>
                                    <option value="15">15 %</option>
                                    <option value="20">20 %</option>
                                    <option value="25">25 %</option>
                                </select>
                            </dd>
                        </div>
                        <div class="totales__fila"><dt>IVA <span class="totales__nota">(exento)</span></dt><dd>0,00 €</dd></div>
                        <div class="totales__fila totales__total"><dt>Total</dt><dd data-total="total"></dd></div>
                    </dl>
                    <p class="totales__nota totales__nota--aviso" id="aviso-400" hidden>
                        Factura de 400 € o más: tiene que llevar el DNI y el domicilio del paciente.
                    </p>
                    <p class="totales__nota">Incluye la mención de exención de IVA (art. 20.Uno.3 Ley 37/1992) para servicios sanitarios.</p>
                </div>
            </div>

            <div class="barra-acciones">
                <p class="barra-acciones__aviso" id="aviso" role="alert"></p>
                <button type="button" class="boton boton--fantasma" id="btnClear">Limpiar</button>
                <button type="submit" class="boton boton--primario" id="btnPrint"><i class="ri-receipt-line" aria-hidden="true"></i> Generar factura</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/main.js" type="module"></script>
    <script src="/js/modules/components/facturas.js" type="module"></script>
</body>
</html>
