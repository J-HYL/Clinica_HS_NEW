        <main class="container main main--ancho">
            <h3 class="container__heading">Crear Elemento</h3>
            <form action="#" class="form">

                <!-- El capturador de foto se pinta aquí desde FotoCaptura.js -->
                <div class="form__group form__group--foto">
                    <span class="form__label">Foto del elemento</span>
                    <div class="foto" id="foto"></div>
                </div>

                <div class="form__group">
                    <label for="nombre" class="form__label">Nombre</label>
                    <input type="text" id="nombre" name="nombre" class="form__input" placeholder="E.g. Fórceps superior recto" data-required="true">
                </div>
                <div class="form__group">
                    <label for="categoria" class="form__label">Categoría</label>
                    <select id="categoria" name="categoria" class="form__input"></select>
                </div>
                <div class="form__group">
                    <label for="descripcion" class="form__label">Descripción</label>
                    <input type="text" id="descripcion" name="descripcion" class="form__input" placeholder="E.g. Acero inoxidable, punta fina">
                </div>

                <div class="form__row">
                    <div class="form__group">
                        <label for="stock" class="form__label">Stock actual</label>
                        <input type="number" id="stock" name="stock" class="form__input" value="0" min="0" step="1" data-required="true">
                    </div>
                    <div class="form__group">
                        <label for="stock_minimo" class="form__label">Stock mínimo</label>
                        <input type="number" id="stock_minimo" name="stock_minimo" class="form__input" value="0" min="0" step="1" data-required="true">
                    </div>
                    <div class="form__group">
                        <label for="unidad" class="form__label">Unidad</label>
                        <select id="unidad" name="unidad" class="form__input"></select>
                    </div>
                </div>

                <div class="form__row">
                    <div class="form__group">
                        <label for="ubicacion" class="form__label">Ubicación</label>
                        <input type="text" id="ubicacion" name="ubicacion" class="form__input" placeholder="E.g. Gabinete 1, cajón 2">
                    </div>
                    <div class="form__group">
                        <label for="estado" class="form__label">Situación</label>
                        <select id="estado" name="estado" class="form__input"></select>
                    </div>
                </div>

                <div class="form__row">
                    <div class="form__group">
                        <label for="marca" class="form__label">Marca</label>
                        <input type="text" id="marca" name="marca" class="form__input" placeholder="E.g. Hu-Friedy">
                    </div>
                    <div class="form__group">
                        <label for="modelo" class="form__label">Modelo</label>
                        <input type="text" id="modelo" name="modelo" class="form__input" placeholder="E.g. FX150">
                    </div>
                    <div class="form__group">
                        <label for="numero_serie" class="form__label">Nº de serie</label>
                        <input type="text" id="numero_serie" name="numero_serie" class="form__input" placeholder="E.g. SN-00123">
                    </div>
                </div>

                <div class="form__row">
                    <div class="form__group">
                        <label for="proveedor" class="form__label">Proveedor</label>
                        <input type="text" id="proveedor" name="proveedor" class="form__input" placeholder="E.g. Dental Ibérica">
                    </div>
                    <div class="form__group">
                        <label for="precio" class="form__label">Precio (€)</label>
                        <input type="number" id="precio" name="precio" class="form__input" placeholder="E.g. 45.90" min="0" step="0.01">
                    </div>
                    <div class="form__group">
                        <label for="caducidad" class="form__label">Caducidad</label>
                        <input type="date" id="caducidad" name="caducidad" class="form__input">
                    </div>
                </div>

                <div class="form__group">
                    <label for="notas" class="form__label">Notas</label>
                    <textarea id="notas" name="notas" class="form__input" rows="3" placeholder="E.g. Revisar calibración cada 6 meses"></textarea>
                </div>

                <div class="form__buttons">
                    <button type="submit" class="form__submit" data-action="create">Crear Elemento <i class="ri-add-line"></i></button>
                    <a href="control.html" class="form__return">Regresar</a>
                </div>
            </form>
