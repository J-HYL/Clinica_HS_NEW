<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudios TAC</title>

    <!-- Scripts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css" integrity="sha512-XcIsjKMcuVe0Ucj/xgIXQnytNwBttJbNjltBV18IOnru2lDPe9KRRyvCXw6Y5H415vbBLRm8+q6fmLUU7DfO6Q==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Styles -->
    <link rel="stylesheet" href="/css/pages/control.css">
    <link rel="stylesheet" href="/css/pages/tac.css">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="assets/favicon/favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/assets/favicon/site.webmanifest"/>

</head>
<body>
    <nav class="sidebar" id="sidebar"></nav>

    <div class="wrapper">
        <h1 class="page-title">TAC</h1>

        <main class="container main">
            <!-- En móvil y tablet solo se ve este aviso (tac.css): la sección no se puede usar ahí. -->
            <div class="tac-solo-escritorio">
                <i class="ri-computer-line"></i>
                <p class="tac-solo-escritorio__titulo">Esta sección solo está disponible en ordenador</p>
                <p>Los estudios TAC ocupan cientos de MB y se manejan con ratón. Ábrela desde un ordenador de la clínica.</p>
            </div>

            <div class="tac-contenido">
                <div class="lista__cabecera">
                    <div>
                        <h3 class="container__heading">Estudios TAC (CBCT)</h3>
                        <p class="tarjeta__subtitulo" id="sin-asignar" hidden></p>
                    </div>
                    <div class="lista__acciones">
                        <button type="button" id="enlace" class="boton boton--secundario boton--pequeno"><i class="ri-links-line" aria-hidden="true"></i> Enlace centros</button>
                        <button type="button" id="anadir" class="boton boton--primario boton--pequeno"><i class="ri-add-line" aria-hidden="true"></i> Añadir TAC</button>
                    </div>
                </div>

                <div id="lista"></div>
            </div>
        </main>
    </div>

    <!-- Dependencias -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="/js/main.js" type="module"></script>
    <script src="/js/pages/tac/control.js" type="module"></script>
</body>
</html>
