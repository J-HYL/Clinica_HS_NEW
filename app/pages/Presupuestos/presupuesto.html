<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generar Presupuesto</title>

    <!-- Scripts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css" integrity="sha512-XcIsjKMcuVe0Ucj/xgIXQnytNwBttJbNjltBV18IOnru2lDPe9KRRyvCXw6Y5H415vbBLRm8+q6fmLUU7DfO6Q==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <!-- Styles -->
    <link rel="stylesheet" href="/css/pages/agregar.css">
    <link rel="stylesheet" href="../../css/pages/presupuestos.css">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="assets/favicon/favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/assets/favicon/site.webmanifest"/>

</head>
<body>
    <nav class="sidebar" id="sidebar"></nav>

    <div class="wrapper">
        <header class="header">
            <div class="header__group">
                <button class="header__menu" aria-label="Abrir Sidebar">
                    <i class="ri-menu-line"></i>
                </button>
                <h1 class="header__heading">HS Dental - <span>Presupuestos</span></h1>
            </div>
        </header>

        <div class="content-layout">
            <main class="container main">
                <div class="form">
                    <div class="form__group">
                        <label for="clienteNo" id="nombreC" class="form__label">Nombre del cliente:</label>
                        <input type="text" id="clienteNo" name="nombre" class="form__input" placeholder="Ingrese el nombre del cliente" data-required="true">
                    </div>
                    <div class="form__group">
                        <label for="tratamiento" class="form__label">Tratamiento:</label>
                        <input type="text" id="tratamiento" class="form__input" placeholder="Nombre del tratamiento" data-validate="email" data-required="true">
                    </div>
                    <div class="form__group">
                        <label for="costo" class="form__label">Costo:</label>
                        <input type="number" id="costo" placeholder="Costo del tratamiento" class="form__input" data-required="true">
                    </div>
                    <div class="form__group">
                        <label for="cantidad"  class="form__label">Cantidad:</label>
                        <input type="number" id="cantidad" placeholder="Cantidad del tratamiento" class="form__input" data-required="true">
                    </div>
                    <div class="form__group">
                        <label for="dientes" class="form__label">Piezas (dientes):</label>
                        <input type="text" id="dientes" placeholder="Ej: 1, 2, 3" class="form__input" data-required="true">
                    </div>
                    <div class="form__group">
                        <label for="medico" class="form__label">Médico:</label>
                        <select id="medico" class="form__input form__input--select" data-required="true">
                          <option value="Furo Eduardo Lopez Perez">Furo Eduardo Lopez Perez</option>
                          <option value="Saidi de Franco">Saidi de Franco</option>
                          <option value="H1">H1</option>
                          <option value="HJ2">HJ2</option>
                        </select>
                    </div>
                    <div class="form__group">
                        <label for="observaciones" class="form__label">Observaciones:</label>
                        <textarea id="observaciones" rows="2" class="form__textarea" placeholder="No hay Observaciones">No hay Observaciones</textarea>
                    </div>
                    <div class="form__buttons">
                        <button onclick="agregarTratamiento()" class="form__submit">Agregar Tratamiento <i class="ri-add-line"></i></button>
                    </div>
                </div>
            </main>

            <aside class="container main">
                <table id="tablaTratamientos">
                    <thead>
                      <tr>
                        <th>Tratamiento</th>
                        <th>Pieza</th>
                        <th>Cantidad</th>
                        <th>Costo</th>
                        <th>Total</th>
                        <th class="acciones"></th>
                      </tr>
                    </thead>
                    <tbody>
                      <!-- Filas dinámicas se generarán aquí -->
                    </tbody>
                </table>
                <p class="total" id="total">Total: €0</p>
                <div class="form__buttons">
                    <button onclick="imprimirPresupuesto()" class="form__submit">Imprimir Presupuesto<i class="ri-printer-line"></i></button>
                </div>
            </aside>

            <div class="descuentos">
                <h3>Tipo de descuento</h3>
                <input id="noDesc" type="radio" name="desc" value="0" checked>
                <label for="noDesc">Sin descuento</label>
                <input id="op1" type="radio" name="desc" value="5">
                <label for="op1">5%</label>
                <input id="op2" type="radio" name="desc" value="10">
                <label for="op2">10%</label>
                <input id="op3" type="radio" name="desc" value="15">
                <label for="op3">15%</label>
                <input id="op3" type="radio" name="desc" value="20">
                <label for="op3">20%</label>
                <input id="op3" type="radio" name="desc" value="25">
                <label for="op3">25%</label>
              </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/main.js" type="module"></script>
    <script src="/js/modules/components/clinica.js"></script>
    <script src="/js/modules/components/odontograma.js"></script>
    <script src="../../js/modules/components/presupuestos.js"></script>
</body>
</html>
