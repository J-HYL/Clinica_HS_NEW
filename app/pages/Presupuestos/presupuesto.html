<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presupuesto · HS Dental</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css" integrity="sha512-XcIsjKMcuVe0Ucj/xgIXQnytNwBttJbNjltBV18IOnru2lDPe9KRRyvCXw6Y5H415vbBLRm8+q6fmLUU7DfO6Q==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/css/pages/documentos.css">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/assets/favicon/site.webmanifest"/>
</head>
<body>
    <nav class="sidebar" id="sidebar"></nav>

    <div class="wrapper">
        <h1 class="page-title">Nuevo presupuesto</h1>

        <!-- Editor: datos, tratamientos, notas y totales -->
        <form class="documento documento-editor" id="editor" novalidate>
            <section class="tarjeta documento__seccion" aria-label="Datos del presupuesto">
                <div class="campos campos--4">
                    <div class="form__group campo--doble">
                        <label class="form__label" for="paciente">Paciente</label>
                        <input class="form__input" id="paciente" list="lista-pacientes" placeholder="Busca un paciente o escribe su nombre" autocomplete="off">
                        <datalist id="lista-pacientes"></datalist>
                    </div>
                    <div class="form__group campo--doble">
                        <label class="form__label" for="profesional">Profesional</label>
                        <select class="form__input form__input--select" id="profesional">
                            <option value="Furo Eduardo Lopez Perez">Furo Eduardo Lopez Perez</option>
                            <option value="Saidi de Franco">Saidi de Franco</option>
                            <option value="H1">H1</option>
                            <option value="HJ2">HJ2</option>
                        </select>
                    </div>
                    <div class="form__group">
                        <label class="form__label" for="fecha">Fecha</label>
                        <input class="form__input" type="date" id="fecha">
                    </div>
                    <div class="form__group">
                        <label class="form__label" for="valido">Válido hasta</label>
                        <input class="form__input" type="date" id="valido">
                    </div>
                </div>
            </section>

            <section class="tarjeta documento__seccion" aria-labelledby="titulo-lineas">
                <div class="documento__cabecera-seccion">
                    <h2 class="documento__titulo" id="titulo-lineas">Tratamientos</h2>
                    <a class="enlace" href="/pages/servicios/control.html">Catálogo de servicios</a>
                </div>
                <div id="lineas"></div>
            </section>

            <div class="documento__pie">
                <div class="form__group">
                    <label class="form__label" for="notas">Notas para el paciente</label>
                    <textarea class="form__textarea" id="notas" rows="4" placeholder="Forma de pago, plazos, financiación…"></textarea>
                </div>
                <dl class="tarjeta totales" aria-live="polite">
                    <div class="totales__fila"><dt>Subtotal</dt><dd data-total="subtotal"></dd></div>
                    <div class="totales__fila" data-fila="descuentos" hidden><dt>Descuentos</dt><dd data-total="descuentos"></dd></div>
                    <div class="totales__fila"><dt>IVA <span class="totales__nota">(exento)</span></dt><dd>0,00 €</dd></div>
                    <div class="totales__fila totales__total"><dt>Total</dt><dd data-total="total"></dd></div>
                </dl>
            </div>

            <div class="documento__barra">
                <p class="documento__aviso" id="aviso" role="alert"></p>
                <button type="button" class="boton boton--fantasma" id="limpiar">Limpiar</button>
                <button type="submit" class="boton boton--primario"><i class="ri-file-text-line" aria-hidden="true"></i> Ver presupuesto</button>
            </div>
        </form>

        <!-- Hoja A4 para imprimir o guardar en PDF -->
        <section class="documento documento-vista" id="vista" aria-label="Presupuesto" hidden>
            <div class="documento-vista__acciones">
                <button type="button" class="boton boton--secundario boton--pequeno" id="editar"><i class="ri-arrow-left-line" aria-hidden="true"></i> Seguir editando</button>
                <button type="button" class="boton boton--primario boton--pequeno" id="imprimir"><i class="ri-printer-line" aria-hidden="true"></i> Imprimir o PDF</button>
            </div>
            <article class="papel" id="papel"></article>
        </section>
    </div>

    <script src="/js/main.js" type="module"></script>
    <script src="/js/modules/components/odontograma.js"></script>
    <script src="/js/pages/presupuestos/presupuesto.js" type="module"></script>
</body>
</html>
