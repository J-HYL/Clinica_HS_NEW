                    <div class="form__group">
                        <label for="dientes" class="form__label">Piezas (dientes):</label>

                    </div>
                    <div class="form__group">
                        <label for="medico" class="form__label">Médico:</label>

                    </div>
                    <div class="form__group">
                        <label for="observaciones" class="form__label">Observaciones:</label>
                        <textarea id="observaciones" rows="2" class="form__textarea" placeholder="No hay Observaciones">No hay Observaciones</textarea>

                    <div class="form__buttons">
                        <button onclick="agregarTratamiento()" class="form__submit">Agregar Tratamiento <i class="ri-add-line"></i></button>
